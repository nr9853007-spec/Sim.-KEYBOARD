<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101322"><title>Космический выживальщик — N1kmeL Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;color:#fff;font-family:system-ui,Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:0 2px 8px #000}.hud span{padding:10px 14px;border:1px solid #ffffff30;border-radius:13px;background:#11172dcc}.screen{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#080b18c9}.panel{width:min(92vw,440px);padding:30px 24px;border:1px solid #8b9bff66;border-radius:25px;background:linear-gradient(145deg,#22294d,#111629);text-align:center;box-shadow:0 20px 70px #0009}.panel h1{font-size:clamp(30px,8vw,48px);line-height:1.05;margin:10px 0}.panel p{color:#c7cbed;line-height:1.65}.ship{font-size:72px;filter:drop-shadow(0 0 20px #8ca7ff)}button{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(#ffe7a4,#ffad50);color:#30203b;font-weight:1000;font-size:17px;cursor:pointer;margin-top:10px}.back{display:inline-block;color:#d5d4ff;margin-top:16px;text-decoration:none;font-weight:800}.hidden{display:none!important}.hint{font-size:12px!important}
</style></head><body><canvas id="game"></canvas><div class="hud hidden" id="hud"><span>⭐ <b id="score">0</b></span><span>Лучший: <b id="best">0</b></span></div>
<div class="screen" id="start"><div class="panel"><div class="ship">🚀</div><h1>КОСМИЧЕСКИЙ<br>ВЫЖИВАЛЬЩИК</h1><p>Уворачивайся от астероидов, собирай звёзды и продержись как можно дольше!</p><button id="play">НАЧАТЬ ПОЛЁТ</button><p class="hint">Управление: ← → или A / D. На телефоне — перемещай корабль пальцем.</p><a class="back" href="./index.html">← В игровой хаб</a></div></div>
<div class="screen hidden" id="over"><div class="panel"><div class="ship">🌌</div><h1>ПОЛЁТ ОКОНЧЕН</h1><p>Твой результат: <b id="final">0</b></p><button id="again">ЕЩЁ РАЗ</button><a class="back" href="./index.html">← В игровой хаб</a></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,ship,rocks=[],stars=[],score=0,best=0,playing=false,last=0,spawn=0,keys={},touchX=null,raf=0;
try{best=+(localStorage.getItem('cosmicBest')||0)}catch(e){}document.getElementById('best').textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(ship)ship.y=h-90}addEventListener('resize',resize);resize();
function reset(){ship={x:w/2,y:h-90,r:17};rocks=[];stars=[];score=0;spawn=0;playing=true;last=0;document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('score').textContent='0';raf=requestAnimationFrame(loop)}
function end(){playing=false;cancelAnimationFrame(raf);best=Math.max(best,Math.floor(score));try{localStorage.setItem('cosmicBest',String(best))}catch(e){}document.getElementById('best').textContent=best;document.getElementById('final').textContent=Math.floor(score);document.getElementById('over').classList.remove('hidden')}
function loop(t){if(!playing)return;const dt=Math.min((t-last||16)/16.67,2);last=t;score+=dt*.12;spawn+=dt;const speed=2.7+Math.min(score/160,4);if(spawn>Math.max(17,42-score/30)){spawn=0;const x=20+Math.random()*(w-40);rocks.push({x,y:-30,r:13+Math.random()*18,v:speed+Math.random()*1.7});if(Math.random()<.48)stars.push({x:20+Math.random()*(w-40),y:-20,r:9,v:speed*.8})}
ctx.clearRect(0,0,w,h);ctx.fillStyle='#080b18';ctx.fillRect(0,0,w,h);for(let i=0;i<65;i++){const x=(i*97)%w,y=(i*173+t*.025)%h;ctx.fillStyle=i%4?'#ffffff55':'#aebaff';ctx.fillRect(x,y,2,2)}
if(keys.ArrowLeft||keys.a||keys.A)ship.x-=5*dt;if(keys.ArrowRight||keys.d||keys.D)ship.x+=5*dt;if(touchX!==null)ship.x+=(touchX-ship.x)*.22;ship.x=Math.max(20,Math.min(w-20,ship.x));
ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowColor='#8da9ff';ctx.shadowBlur=22;ctx.font='36px system-ui';ctx.textAlign='center';ctx.fillText('🚀',0,12);ctx.restore();
for(const r of rocks){r.y+=r.v*dt;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fillStyle='#8a91a9';ctx.fill();ctx.strokeStyle='#c7cce0';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#59627e';ctx.beginPath();ctx.arc(r.x-r.r*.25,r.y-r.r*.2,r.r*.22,0,7);ctx.fill()}
for(const s of stars){s.y+=s.v*dt;ctx.font='22px system-ui';ctx.fillText('⭐',s.x,s.y);if(Math.hypot(s.x-ship.x,s.y-ship.y)<27){s.y=h+50;score+=25}}
if(rocks.some(r=>Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+13)){end();return}
rocks=rocks.filter(r=>r.y<h+50);stars=stars.filter(s=>s.y<h+40);document.getElementById('score').textContent=Math.floor(score);raf=requestAnimationFrame(loop)}
addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons)touchX=e.clientX});canvas.addEventListener('pointerdown',e=>{touchX=e.clientX});canvas.addEventListener('pointerup',()=>touchX=null);
document.getElementById('play').addEventListener('click',reset);document.getElementById('again').addEventListener('click',reset);
})();
</script></body></html>
