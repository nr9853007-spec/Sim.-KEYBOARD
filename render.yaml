services:
  - type: web
    name: n1kmel-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: n1kmel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/site.db
      - key: ADMIN_USERNAME
        value: N1kmeL
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
