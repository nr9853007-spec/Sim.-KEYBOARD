<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5a623">
<title>ШАВУХА RUN — Убеги!</title>
<style>
:root{color-scheme:dark;--gold:#ffbd38;--ink:#25170e}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;background:#24180f;color:white}button{font:inherit;cursor:pointer;border:0}.game{position:relative;width:100%;height:100%;min-height:420px;background:linear-gradient(#ffcf75,#e77b36 48%,#4b3225);overflow:hidden}.scene{position:absolute;inset:0;background:linear-gradient(180deg,#ffcf78 0%,#f3a14e 44%,#67402b 100%)}.sun{position:absolute;top:8%;left:12%;width:100px;height:100px;border-radius:50%;background:#fff1b5;box-shadow:0 0 70px #ffe39b}.buildings{position:absolute;bottom:43%;left:0;width:100%;height:32%;background:linear-gradient(90deg,#9d6040 0 12%,transparent 12% 15%,#b8754b 15% 27%,transparent 27% 31%,#8e5137 31% 43%,transparent 43% 47%,#b8754b 47% 60%,transparent 60% 64%,#95563a 64% 78%,transparent 78% 82%,#b8754b 82%);opacity:.8}.road{position:absolute;left:50%;bottom:-5%;width:min(94vw,780px);height:65%;transform:translateX(-50%);background:linear-gradient(90deg,#49352a,#76503a 50%,#49352a);clip-path:polygon(37% 0,63% 0,100% 100%,0 100%)}.road:before,.road:after{content:"";position:absolute;top:0;bottom:0;width:7px;background:#f6d39a;opacity:.75;transform-origin:top}.road:before{left:37%;transform:rotate(15deg)}.road:after{right:37%;transform:rotate(-15deg)}.lane-line{position:absolute;top:0;bottom:0;left:50%;width:5px;background:repeating-linear-gradient(to bottom,#ffe6b4 0 30px,transparent 30px 65px);opacity:.6;transform:perspective(300px) rotateX(18deg)}.hud{position:absolute;z-index:3;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;font-weight:900;text-shadow:0 2px 5px #40200b}.pill{padding:10px 15px;border-radius:15px;background:#2d1c12b8;border:1px solid #ffffff30}.menu,.overlay{position:absolute;z-index:8;inset:0;display:grid;place-items:center;padding:22px;background:linear-gradient(#24180e35,#24180e9c)}.panel{width:min(92vw,470px);padding:28px 24px;border:3px solid #ffe1a0;border-radius:28px;background:linear-gradient(160deg,#7e3f20f5,#321d14f5);box-shadow:0 18px 60px #21100888;text-align:center}.logo{font-size:clamp(42px,10vw,72px);line-height:.95;font-weight:1000;letter-spacing:-4px;color:#ffd15a;text-shadow:0 5px 0 #a84e1b,0 9px 18px #160c06}.logo span{display:block;font-size:.47em;letter-spacing:5px;color:white;margin-top:9px}.wrap-art{font-size:78px;filter:drop-shadow(0 8px 3px #1e0f08);margin:12px}.tag{color:#ffdda0;font-weight:700;margin:8px 0 20px}.main-btn{width:100%;padding:17px 20px;border-radius:16px;background:linear-gradient(#ffe078,#ff9f26);color:#54270e;font-size:22px;font-weight:1000;box-shadow:0 6px 0 #a64c16,0 10px 20px #170b0680;transition:transform .12s}.main-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a64c16}.hint{font-size:13px;line-height:1.6;color:#f8d9b4;margin:18px 0 0}.hidden{display:none!important}.character{position:absolute;z-index:4;bottom:12%;left:50%;font-size:clamp(48px,9vw,76px);transform:translateX(-50%);filter:drop-shadow(0 7px 3px #201007);transition:left .12s}.chaser{position:absolute;z-index:2;bottom:13%;left:50%;font-size:clamp(45px,8vw,66px);transform:translateX(-50%);filter:drop-shadow(0 5px 3px #25130a);opacity:.95}.obstacle{position:absolute;z-index:3;top:0;left:50%;font-size:34px;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 3px #201007)}.mobile-controls{position:absolute;z-index:6;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}.mobile-controls button{pointer-events:auto;width:64px;height:58px;border-radius:17px;background:#2c1a12b8;border:1px solid #ffffff55;color:white;font-size:27px}.toast{position:absolute;z-index:9;top:70px;left:50%;transform:translateX(-50%);background:#2a1a11dd;padding:9px 15px;border-radius:14px;font-weight:800;white-space:nowrap}.small{font-size:12px;color:#f7d8ad;margin-top:15px}@media(min-width:800px){.mobile-controls{display:none}}
</style>
</head>
<body>
<main class="game" id="game">
 <div class="scene"><div class="sun"></div><div class="buildings"></div><div class="road"><div class="lane-line"></div></div></div>
 <div class="hud hidden" id="hud"><div class="pill">⭐ <span id="score">0</span></div><div class="pill">🌯 <span id="coins">0</span></div><div class="pill">🏃 <span id="speed">1</span>x</div></div>
 <div class="chaser hidden" id="chaser">👩‍🦰🛒</div><div class="character hidden" id="player">🌯</div>
 <div class="menu" id="menu"><section class="panel"><div class="logo">ШАВУХА<span>RUN</span></div><div class="wrap-art">🌯</div><p class="tag">УБЕГАЙ. СОБИРАЙ. НЕ ОСТЫВАЙ!</p><button class="main-btn" id="play">ИГРАТЬ</button><p class="hint">← → или A / D — менять полосу<br>На телефоне — нажимай стрелки или свайпай</p><div class="small">Осторожно: сзади очень настойчивая погоня 😅</div></section></div>
 <div class="overlay hidden" id="over"><section class="panel"><div class="logo" style="font-size:48px">ОЙ, ШАВУХА!</div><div class="wrap-art">🥙💨</div><p class="tag">Тебя почти догнали!</p><p>Счёт: <b id="finalScore">0</b> · Шавух собрано: <b id="finalCoins">0</b></p><button class="main-btn" id="again">ЕЩЁ РАЗ</button><p class="hint">Попробуй продержаться дольше!</p></section></div>
 <div class="mobile-controls hidden" id="controls"><button id="left">◀</button><button id="right">▶</button></div>
 <div class="toast hidden" id="toast">+1 🌯</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),menu=$('menu'),over=$('over'),player=$('player'),chaser=$('chaser'),hud=$('hud'),controls=$('controls'),game=$('game');
let running=false,lane=1,score=0,coins=0,speed=1,last=0,spawn=0,items=[],raf=0,toastTimer;
const lanes=[30,50,70];
function setLane(){player.style.left=lanes[lane]+'%';chaser.style.left=lanes[lane]+'%'}
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));setLane()}
function showToast(){const t=$('toast');t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),500)}
function start(){cancelAnimationFrame(raf);items.forEach(x=>x.el.remove());items=[];lane=1;score=0;coins=0;speed=1;spawn=0;last=0;running=true;setLane();$('score').textContent='0';$('coins').textContent='0';$('speed').textContent='1';menu.classList.add('hidden');over.classList.add('hidden');hud.classList.remove('hidden');player.classList.remove('hidden');chaser.classList.remove('hidden');controls.classList.remove('hidden');raf=requestAnimationFrame(loop)}
function end(){running=false;cancelAnimationFrame(raf);$('finalScore').textContent=Math.floor(score);$('finalCoins').textContent=coins;over.classList.remove('hidden');controls.classList.add('hidden')}
function spawnItem(){const laneN=Math.floor(Math.random()*3),coin=Math.random()<.38,el=document.createElement('div');el.className='obstacle';el.textContent=coin?'🌯':['🛑','🧱','🪣','🚧'][Math.floor(Math.random()*4)];el.dataset.lane=laneN;game.appendChild(el);items.push({el,lane:laneN,y:-5,coin,hit:false})}
function loop(t){if(!running)return;const dt=Math.min((t-last)/16.67||1,2);last=t;score+=dt*speed*.22;speed=1+Math.floor(score/450)*.12;$('score').textContent=Math.floor(score);$('speed').textContent=speed.toFixed(1);spawn+=dt*speed;if(spawn>48){spawn=0;spawnItem()}
const bottom=game.clientHeight*.79;
items.forEach(it=>{it.y+=dt*(.72+speed*.17);it.el.style.top=it.y+'%';it.el.style.left=lanes[it.lane]+'%';it.el.style.fontSize=(24+it.y*.12)+'px';const playerY=game.clientHeight*.78;if(!it.hit&&it.y>72&&it.y<88&&it.lane===lane){it.hit=true;if(it.coin){coins++;$('coins').textContent=coins;it.el.textContent='✨';showToast()}else{end()}}});
items=items.filter(it=>{if(it.y>112){it.el.remove();return false}return true});if(running)raf=requestAnimationFrame(loop)}
$('play').addEventListener('click',start);$('again').addEventListener('click',start);$('left').addEventListener('click',()=>move(-1));$('right').addEventListener('click',()=>move(1));
window.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}if(e.key===' '&&!running&&!over.classList.contains('hidden'))start()});
let sx=0,sy=0;game.addEventListener('touchstart',e=>{const p=e.changedTouches[0];sx=p.clientX;sy=p.clientY},{passive:true});game.addEventListener('touchend',e=>{const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;if(Math.abs(dx)>24&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)},{passive:true});
})();
</script>
</body>
</html>
