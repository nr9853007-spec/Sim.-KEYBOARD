<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Реакция! | N1kmeL Hub</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 0,#28466a,#101827 65%);color:#f2f6ff;font-family:Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.app{width:min(100%,480px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}a{color:#b9e9f4;text-decoration:none;font-size:12px;font-weight:800}.tag{font-size:10px;letter-spacing:2px;color:#8de8db;font-weight:900;text-align:center}.title{text-align:center;font-size:clamp(36px,10vw,54px);line-height:1.05;margin:12px 0}.sub{text-align:center;color:#aabbd0;font-size:13px;line-height:1.6;margin:0 auto 25px;max-width:350px}.panel{padding:18px;border:1px solid #ffffff20;border-radius:24px;background:#1a2a40d9;box-shadow:0 20px 55px #050b1680}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:15px}.stat{padding:12px;border-radius:14px;background:#ffffff0b;text-align:center}.stat small{display:block;color:#9fb2c9;font-size:9px;font-weight:900;letter-spacing:1px}.stat strong{display:block;font-size:25px;margin-top:4px}.arena{width:100%;height:245px;border:0;border-radius:18px;background:linear-gradient(145deg,#29415d,#1b2b41);color:#dceeff;font-size:18px;font-weight:900;cursor:pointer;transition:background .2s,transform .15s;touch-action:manipulation}.arena:active{transform:scale(.985)}.arena.wait{background:linear-gradient(145deg,#a04452,#672d4a)}.arena.ready{background:linear-gradient(145deg,#1e9b75,#12634f);color:white}.arena.done{background:linear-gradient(145deg,#355b83,#263e63)}.message{text-align:center;min-height:44px;padding:14px 4px 3px;color:#c4d4e7;font-size:12px;font-weight:800;line-height:1.5}.restart{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(110deg,#9bf0df,#b8a3ff);color:#18243a;font-weight:1000;cursor:pointer}.tip{text-align:center;color:#8096ae;font-size:10px;line-height:1.6;margin:16px 8px 0}
</style></head><body><main class="app"><header><a href="index.html">← N1KMEL HUB</a><span class="tag">МИНИ-ИГРА №06</span></header><div class="tag">ПРОВЕРЬ СВОЮ СКОРОСТЬ</div><h1 class="title">РЕАКЦИЯ!</h1><p class="sub">Дождись зелёного сигнала и нажми как можно быстрее. Не торопись — ранний клик не засчитывается!</p><section class="panel"><div class="stats"><div class="stat"><small>ПОСЛЕДНИЙ РЕЗУЛЬТАТ</small><strong id="last">—</strong></div><div class="stat"><small>ЛУЧШЕЕ ВРЕМЯ</small><strong id="best">—</strong></div></div><button class="arena" id="arena">Нажми «Старт»<br><small style="font-size:11px;font-weight:600;opacity:.75">Проверим твою реакцию</small></button><div class="message" id="message" aria-live="polite">Нажми кнопку ниже, чтобы начать раунд.</div><button class="restart" id="start">НАЧАТЬ</button></section><p class="tip">Совет: не нажимай заранее. Время измеряется в миллисекундах.</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let state='idle',started=0,timer=0,delay=0,best=Infinity;try{best=Number(localStorage.getItem('reactionBest'))||Infinity}catch{}function showBest(){$('best').textContent=Number.isFinite(best)?best+' мс':'—'}showBest();function start(){clearTimeout(timer);state='wait';$('arena').className='arena wait';$('arena').innerHTML='ЖДИ ЗЕЛЁНОГО…';$('message').textContent='Сигнал появится в случайный момент.';$('start').textContent='ОТМЕНА';delay=1300+Math.random()*3000;timer=setTimeout(()=>{if(state!=='wait')return;state='ready';started=performance.now();$('arena').className='arena ready';$('arena').textContent='ЖМИ!';$('message').textContent='СЕЙЧАС!'},delay)}function tap(){if(state==='wait'){clearTimeout(timer);state='idle';$('arena').className='arena done';$('arena').textContent='Слишком рано!';$('message').textContent='Нужно дождаться зелёного сигнала. Попробуй ещё раз.';$('start').textContent='ЕЩЁ РАЗ';return}if(state==='ready'){const ms=Math.round(performance.now()-started);state='done';$('last').textContent=ms+' мс';$('arena').className='arena done';$('arena').textContent=ms<220?'МОЛНИЕНОСНО!':ms<320?'ОТЛИЧНО!':'ХОРОШИЙ РЕЗУЛЬТАТ';$('message').textContent='Твоя реакция: '+ms+' мс.';if(ms<best){best=ms;try{localStorage.setItem('reactionBest',String(best))}catch{}showBest()}$('start').textContent='ЕЩЁ РАЗ'}}$('arena').addEventListener('click',tap);$('start').addEventListener('click',()=>{if(state==='wait'){clearTimeout(timer);state='idle';$('arena').className='arena';$('arena').innerHTML='Раунд отменён';$('message').textContent='Готов попробовать ещё раз?';$('start').textContent='НАЧАТЬ'}else start()})})();
</script></body></html>
