<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172e"><title>Mini Arcade — N1kmeL's Hub</title>
<style>
:root{color-scheme:dark;--cyan:#8ff7ff;--violet:#b69cff;--muted:#aeb6d9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#254b7d88,transparent 35%),radial-gradient(ellipse at 90% 60%,#6b327355,transparent 35%),#0b1023;color:#f5f7ff;font-family:system-ui,sans-serif}a{color:var(--cyan);text-decoration:none}header{max-width:980px;margin:auto;padding:20px;display:flex;justify-content:space-between;font-weight:900}main{width:min(980px,calc(100% - 28px));margin:12px auto 50px}.hero{text-align:center;margin:20px 0}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:900}.hero h1{font-size:clamp(34px,7vw,58px);margin:7px 0;background:linear-gradient(90deg,#fff,#8ff7ff,#c5a5ff);background-clip:text;color:transparent}.hero p{color:var(--muted)}.panel{max-width:760px;margin:auto;padding:18px;border:1px solid #8ff7ff3a;border-radius:22px;background:linear-gradient(145deg,#20264aee,#131a35f5);box-shadow:0 24px 70px #0007}.stats{display:flex;justify-content:center;gap:12px;margin-bottom:14px}.stats b{padding:9px 14px;border-radius:12px;background:#ffffff0b;color:var(--cyan)}#game{min-height:320px;display:grid;place-items:center}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid #8ff7ff55;border-radius:12px;padding:12px 16px;background:#27345b;color:#f5f7ff;font-weight:850;cursor:pointer}.btn.primary{background:linear-gradient(110deg,#8ff7ff,#b69cff);color:#121932;border:0}.hint{text-align:center;color:#c3c9e6;min-height:24px;margin:14px 0 0;font-size:13px}.board{display:grid;gap:5px;touch-action:manipulation;user-select:none}.tile{width:clamp(34px,8vw,56px);aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:clamp(19px,4vw,30px);font-weight:900}.wall{background:#46547d}.floor{background:#202d50;border:1px solid #ffffff14}.goal{background:#285b64}.box{background:#d39b55;color:#30203a}.box.done{background:#63d7b6}.player{background:#8ff7ff;color:#14203d}.canvas{width:min(100%,620px);border:1px solid #8ff7ff55;border-radius:16px;background:#101a35;touch-action:none}.pad{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.pad button{min-width:54px}.word{font-size:clamp(24px,6vw,42px);font-weight:950;letter-spacing:2px;color:var(--cyan);text-align:center;margin:15px}.typing{width:min(100%,430px);padding:15px;border-radius:12px;background:#101a35;color:white;border:1px solid #8ff7ff88;font-size:18px;text-align:center}.beat-lanes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,520px)}.beat-lane{height:220px;border-radius:18px;background:linear-gradient(#26385e,#121b38);border:1px solid #8ff7ff44;display:flex;align-items:end;justify-content:center;padding-bottom:18px;font-size:30px;position:relative;overflow:hidden}.beat-lane.hit{background:#3e987e;box-shadow:0 0 30px #6affc966}.beat-dot{position:absolute;top:15px;font-size:32px;transition:top .08s}.golf-help{text-align:center;color:#c3c9e6;margin:8px}.score-big{font-size:42px;color:var(--cyan);font-weight:950}@media(max-width:600px){.panel{padding:12px}.beat-lane{height:180px}.stats{gap:6px}.stats b{padding:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><header><a href="index.html">N1kmeL's Hub</a><a href="index.html#games">← Все игры</a></header><main><div class="hero"><div class="eyebrow">FIVE DIFFERENT GAMEPLAY STYLES</div><h1 id="title">MINI ARCADE</h1><p id="subtitle"></p></div><section class="panel"><div class="stats"><b>ОЧКИ: <span id="score">0</span></b><b>РЕКОРД: <span id="best">0</span></b></div><div id="game"></div><div class="actions" id="actions"></div><p class="hint" id="hint" aria-live="polite"></p></section></main>
<script>(()=>{'use strict';const mode=new URLSearchParams(location.search).get('mode')||'sokoban',root=document.getElementById('game'),actions=document.getElementById('actions'),hint=document.getElementById('hint'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');let score=0,best=Number(localStorage.getItem('n1kmel_'+mode)||0),cleanups=[];const cfg={'sokoban':['SOKOBAN','Логическая задача: передвинь все ящики на отмеченные клетки.'],'mini-golf':['MINI GOLF','Спорт и физика: тяни от мяча назад, чтобы прицелиться и ударить.'],'neon-pong':['NEON PONG','Классический аркадный пинг-понг: отбивай шар платформой.'],'beat-drop':['BEAT DROP','Ритм-игра: нажимай на дорожку, когда нота достигает нижней зоны.'],'word-rush':['WORD RUSH','Печатай появляющиеся слова до окончания таймера.']};const conf=cfg[mode]||cfg.sokoban;document.getElementById('title').textContent=conf[0];document.getElementById('subtitle').textContent=conf[1];document.title=conf[0]+" — N1kmeL's Hub";bestEl.textContent=best;
function reset(){cleanups.forEach(f=>f());cleanups=[];score=0;scoreEl.textContent='0';root.innerHTML='';actions.innerHTML='';hint.textContent=''}function add(n){score+=n;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('n1kmel_'+mode,String(best))}}function button(t,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=t;b.onclick=fn;actions.append(b)}function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.className='canvas';c.style.aspectRatio=w+'/'+h;root.append(c);return c}
function sokoban(){reset();const walls=new Set();for(let x=0;x<8;x++){walls.add(x);walls.add(56+x)}for(let y=0;y<8;y++){walls.add(y*8);walls.add(y*8+7)}[[3,1],[3,2],[3,3],[3,4],[5,4]].forEach(([x,y])=>walls.add(y*8+x));const goals=new Set([1*8+5,2*8+5,6*8+5]),boxes=new Set([2*8+2,3*8+3,5*8+4]);let player=5*8+1,moves=0;const g=document.createElement('div');g.className='board';g.style.gridTemplateColumns='repeat(8,minmax(0,1fr))';root.append(g);function draw(){g.innerHTML='';for(let i=0;i<64;i++){const d=document.createElement('div');let isBox=boxes.has(i),isGoal=goals.has(i);d.className='tile '+(walls.has(i)?'wall':isBox?(isGoal?'box done':'box'):i===player?'player':isGoal?'goal':'floor');d.textContent=walls.has(i)?'':isBox?(isGoal?'✦':'▣'):i===player?'●':isGoal?'◎':'';g.append(d)}hint.textContent='Ходы: '+moves+' · Ящики на целях: '+[...boxes].filter(x=>goals.has(x)).length+'/'+goals.size;if([...boxes].filter(x=>goals.has(x)).length===goals.size)hint.textContent='Уровень пройден! Все ящики на местах.'}function move(dx,dy){const x=player%8,y=Math.floor(player/8),nx=x+dx,ny=y+dy,to=ny*8+nx;if(walls.has(to))return;if(boxes.has(to)){const beyond=(ny+dy)*8+(nx+dx);if(walls.has(beyond)||boxes.has(beyond))return;boxes.delete(to);boxes.add(beyond)}player=to;moves++;draw()}const key=e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(...d)}};window.addEventListener('keydown',key);cleanups.push(()=>window.removeEventListener('keydown',key));[['↑',0,-1],['←',-1,0],['↓',0,1],['→',1,0]].forEach(([t,x,y])=>button(t,()=>move(x,y)));button('Заново',sokoban);draw()}
function golf(){reset();let c=canvas(600,380),ctx=c.getContext('2d'),ball={x:75,y:300,vx:0,vy:0},hole={x:520,y:80},walls=[{x:170,y:0,w:18,h:230},{x:330,y:150,w:18,h:230},{x:430,y:0,w:18,h:170}],aim=null,strokes=0,done=false,raf;function draw(){ctx.clearRect(0,0,600,380);ctx.fillStyle='#153b48';ctx.fillRect(0,0,600,380);ctx.strokeStyle='#4b9b9d';ctx.lineWidth=5;ctx.strokeRect(4,4,592,372);ctx.fillStyle='#f8e98b';ctx.beginPath();ctx.arc(hole.x,hole.y,13,0,7);ctx.fill();ctx.fillStyle='#8ff7ff';walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();if(aim){ctx.strokeStyle='#bba4ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+(ball.x-aim.x)*.65,ball.y+(ball.y-aim.y)*.65);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='16px system-ui';ctx.fillText('Удары: '+strokes,20,28)}function frame(){if(!done){ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.985;ball.vy*=.985;if(Math.abs(ball.vx)+Math.abs(ball.vy)<.08)ball.vx=ball.vy=0;if(ball.x<14||ball.x>586)ball.vx*=-.8;if(ball.y<14||ball.y>366)ball.vy*=-.8;walls.forEach(w=>{if(ball.x>w.x-9&&ball.x<w.x+w.w+9&&ball.y>w.y-9&&ball.y<w.y+w.h+9){if(ball.x<w.x||ball.x>w.x+w.w)ball.vx*=-.8;else ball.vy*=-.8}});if(Math.hypot(ball.x-hole.x,ball.y-hole.y)<15&&Math.hypot(ball.vx,ball.vy)<2){done=true;add(Math.max(20,120-strokes*10));hint.textContent='Лунка! Отличная точность — ударов: '+strokes;}}draw();raf=requestAnimationFrame(frame)}function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*380/r.height}}c.onpointerdown=e=>{if(Math.hypot(ball.vx,ball.vy)>.3||done)return;aim=pos(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(aim){aim=pos(e);draw()}};c.onpointerup=e=>{if(!aim)return;const p=pos(e),dx=ball.x-p.x,dy=ball.y-p.y,m=Math.hypot(dx,dy),k=Math.min(11,m*.075);ball.vx=dx/(m||1)*k;ball.vy=dy/(m||1)*k;aim=null;strokes++;draw()};raf=requestAnimationFrame(frame);cleanups.push(()=>cancelAnimationFrame(raf));button('Новая лунка',golf);hint.textContent='Потяни от мяча назад и отпусти. Сила зависит от длины тяги.'}
function pong(){reset();let c=canvas(600,380),ctx=c.getContext('2d'),p=170,ball={x:300,y:190,vx:4,vy:3},keys={},alive=true,raf;function frame(){ctx.fillStyle='#101a35';ctx.fillRect(0,0,600,380);ctx.strokeStyle='#456080';ctx.setLineDash([8,10]);ctx.beginPath();ctx.moveTo(300,0);ctx.lineTo(300,380);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#8ff7ff';ctx.fillRect(18,p,13,80);ctx.fillRect(569,150,13,80);ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();if(keys.ArrowUp||keys.w)p-=7;if(keys.ArrowDown||keys.s)p+=7;p=Math.max(0,Math.min(300,p));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<9||ball.y>371)ball.vy*=-1;if(ball.x<38&&ball.y>p-8&&ball.y<p+88){ball.vx=Math.abs(ball.vx)*1.04;add(1)}if(ball.x>562&&ball.y>142&&ball.y<238)ball.vx*=-1;if(ball.x<0||ball.x>600){alive=false;hint.textContent='Мяч потерян. Очки: '+score+'. Нажми «Заново».'}if(alive)raf=requestAnimationFrame(frame)}const key=e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()},up=e=>keys[e.key]=false;window.addEventListener('keydown',key);window.addEventListener('keyup',up);c.onpointermove=e=>{const r=c.getBoundingClientRect();p=(e.clientY-r.top)*380/r.height-40};raf=requestAnimationFrame(frame);cleanups.push(()=>{cancelAnimationFrame(raf);window.removeEventListener('keydown',key);window.removeEventListener('keyup',up)});button('Заново',pong);hint.textContent='Управление: ↑ ↓ или W/S. На телефоне двигай пальцем по полю.'}
function beat(){reset();const g=document.createElement('div');g.className='beat-lanes';root.append(g);let active=-1,scoreHits=0,miss=0,running=false,raf,last=0,beatNo=0,notes=[];for(let i=0;i<4;i++){const lane=document.createElement('button');lane.className='beat-lane';lane.textContent=['1','2','3','4'][i];lane.onclick=()=>hit(i);g.append(lane)}function hit(i){if(!running)return;let bestIndex=-1,bestDist=999;notes.forEach((n,j)=>{if(n.lane===i&&Math.abs(n.y-180)<48&&Math.abs(n.y-180)<bestDist){bestDist=Math.abs(n.y-180);bestIndex=j}});if(bestIndex>=0){notes.splice(bestIndex,1);scoreHits++;add(10);hint.textContent='Попал в ритм! Серия: '+scoreHits}else{miss++;hint.textContent='Мимо — слушай следующий бит.'}}function frame(t){if(!running)return;if(t-last>570){last=t;notes.push({lane:Math.floor(Math.random()*4),y:0});beatNo++}notes.forEach(n=>n.y+=3.1);notes=notes.filter(n=>{if(n.y>235){miss++;return false}return true});[...g.children].forEach((el,i)=>{el.innerHTML=String(i+1);notes.filter(n=>n.lane===i).forEach(n=>{const d=document.createElement('span');d.className='beat-dot';d.textContent='●';d.style.top=n.y+'px';el.append(d)})});if(beatNo>35){running=false;hint.textContent='Трек завершён! Попаданий: '+scoreHits+' · промахов: '+miss;return}raf=requestAnimationFrame(frame)}button('Начать трек',()=>{scoreHits=0;miss=0;beatNo=0;notes=[];last=0;running=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)},true);cleanups.push(()=>cancelAnimationFrame(raf));hint.textContent='Нажимай одну из четырёх дорожек, когда нота подходит к нижней отметке.'}
function words(){reset();const list=['КОСМОС','МОЛНИЯ','КРИСТАЛЛ','ПЛАНЕТА','РАКЕТА','ГАЛАКТИКА','ОРБИТА','ЭНЕРГИЯ','КОМЕТА','НЕОН','ЗВЕЗДА','ТЕЛЕСКОП','ПРИЗРАК','ЛАБИРИНТ'];let word='',time=45,typed=0,timer=null;const wrap=document.createElement('div');wrap.style.textAlign='center';wrap.style.width='100%';const big=document.createElement('div');big.className='word';const input=document.createElement('input');input.className='typing';input.placeholder='Напечатай слово…';input.autocomplete='off';input.autocapitalize='characters';const clock=document.createElement('div');clock.className='score-big';clock.textContent='45';wrap.append(big,input,clock);root.append(wrap);function next(){word=list[Math.floor(Math.random()*list.length)];big.textContent=word;input.value='';input.focus()}input.oninput=()=>{if(input.value.trim().toLocaleUpperCase('ru')===word){typed++;add(word.length*5);hint.textContent='Верно! Слов: '+typed;next()}};button('Начать заново',words);next();timer=setInterval(()=>{time--;clock.textContent=time;if(time<=0){clearInterval(timer);input.disabled=true;hint.textContent='Время! Ты набрал '+typed+' слов и '+score+' очков.'}},1000);cleanups.push(()=>clearInterval(timer));hint.textContent='45 секунд. Можно вводить заглавными или строчными буквами.'}
({sokoban, 'mini-golf':golf,'neon-pong':pong,'beat-drop':beat,'word-rush':words}[mode]||sokoban)();
})();</script></body></html>
