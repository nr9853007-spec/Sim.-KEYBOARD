<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172e"><title>Аркада — N1kmeL's Hub</title>
<style>
:root{color-scheme:dark;--cyan:#8ff7ff;--violet:#b69cff;--panel:#171d3a;--muted:#aeb6d9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#254b7d88,transparent 35%),radial-gradient(ellipse at 90% 60%,#6b327355,transparent 35%),#0b1023;color:#f5f7ff;font-family:system-ui,sans-serif}a{color:var(--cyan);text-decoration:none}header{max-width:980px;margin:auto;padding:20px;display:flex;justify-content:space-between;font-weight:900}main{width:min(980px,calc(100% - 28px));margin:12px auto 50px}.hero{text-align:center;margin:20px 0}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:900}.hero h1{font-size:clamp(34px,7vw,58px);margin:7px 0;background:linear-gradient(90deg,#fff,#8ff7ff,#c5a5ff);background-clip:text;color:transparent}.hero p{color:var(--muted)}.panel{max-width:720px;margin:auto;padding:18px;border:1px solid #8ff7ff3a;border-radius:22px;background:linear-gradient(145deg,#20264aee,#131a35f5);box-shadow:0 24px 70px #0007}.stats{display:flex;justify-content:center;gap:12px;margin-bottom:14px}.stats b{padding:9px 14px;border-radius:12px;background:#ffffff0b;color:var(--cyan)}#game{min-height:300px;display:grid;place-items:center}.grid{display:grid;gap:7px;width:min(100%,430px);touch-action:none;user-select:none}.cell{aspect-ratio:1;border:1px solid #ffffff24;border-radius:12px;background:linear-gradient(145deg,#3b4778,#1b2549);display:grid;place-items:center;font-size:clamp(18px,4vw,32px);font-weight:900;box-shadow:inset 0 1px #fff2,0 5px 12px #0004;cursor:pointer;transition:transform .12s,filter .12s}.cell:active{transform:scale(.94)}.cell.empty{opacity:.13}.cell.good{background:linear-gradient(145deg,#79eacb,#2c9b9a);color:#082a39}.cell.bad{background:linear-gradient(145deg,#ff9abf,#b94b83)}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid #8ff7ff55;border-radius:12px;padding:12px 16px;background:#27345b;color:#f5f7ff;font-weight:850;cursor:pointer}.btn.primary{background:linear-gradient(110deg,#8ff7ff,#b69cff);color:#121932;border:0}.hint{text-align:center;color:#c3c9e6;min-height:24px;margin:14px 0 0;font-size:13px}.lane-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,460px)}.lane{height:210px;border-radius:18px;border:1px solid #8ff7ff44;background:linear-gradient(#1b3152,#101b36);display:grid;place-items:center;font-size:38px;position:relative;overflow:hidden}.lane.active{box-shadow:inset 0 0 30px #6ceeff55;border-color:#b9faff}.memory-card{aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#5d58a0,#29335e);display:grid;place-items:center;font-size:clamp(20px,5vw,36px);cursor:pointer;border:1px solid #b5caff55}.memory-card.open,.memory-card.matched{background:linear-gradient(145deg,#9ff6eb,#4f9eb5);color:#122b43}.reaction-pad{width:min(100%,420px);height:250px;border-radius:22px;border:1px solid #8ff7ff55;background:#253153;display:grid;place-items:center;text-align:center;font-size:clamp(20px,4vw,32px);font-weight:950;cursor:pointer}.reaction-pad.go{background:linear-gradient(145deg,#42d69c,#178c78);color:#062d29}.merge-grid{grid-template-columns:repeat(4,1fr)}.merge-cell{background:#ffffff10;border:1px solid #ffffff1b;border-radius:12px;aspect-ratio:1;display:grid;place-items:center;font-size:clamp(17px,4vw,28px);font-weight:950;color:#fff}.merge-cell[data-v="2"]{background:#3a6680}.merge-cell[data-v="4"]{background:#477b9a}.merge-cell[data-v="8"]{background:#a56c4b}.merge-cell[data-v="16"]{background:#b65b83}.merge-cell[data-v="32"]{background:#8c61ba}.merge-cell[data-v="64"]{background:#cf8b54}.merge-cell[data-v="128"],.merge-cell[data-v="256"],.merge-cell[data-v="512"]{background:#b8a24e;color:#17233b}@media(max-width:600px){.panel{padding:12px}.lane{height:160px}.cell{border-radius:8px;gap:4px}.grid{gap:5px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><header><a href="index.html">N1kmeL's Hub</a><a href="index.html#games">← Все игры</a></header><main><div class="hero"><div class="eyebrow">N1KMEL'S HUB · MINI ARCADE</div><h1 id="title">АРКАДА</h1><p id="subtitle">Короткие игры — большие комбо.</p></div><section class="panel"><div class="stats"><b>ОЧКИ: <span id="score">0</span></b><b>РЕКОРД: <span id="best">0</span></b></div><div id="game"></div><div class="actions" id="actions"></div><p class="hint" id="hint" aria-live="polite"></p></section></main>
<script>
(()=>{'use strict';
const q=new URLSearchParams(location.search),mode=q.get('mode')||'block-pop',root=document.getElementById('game'),actions=document.getElementById('actions'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),hint=document.getElementById('hint');
const configs={
'block-pop':['BLOCK POP','Соединяй касающиеся блоки одного цвета. Группа от двух блоков исчезает.'],
'sky-dash':['SKY DASH','Переключай дорожки и избегай препятствий. Нажми на свободную дорожку.'],
'number-merge':['NUMBER MERGE','Сдвигай плитки стрелками или свайпом. Одинаковые числа объединяются.'],
'memory-match':['MEMORY MATCH','Открывай две карточки и находи пары одинаковых символов.'],
'neon-reaction':['NEON REACTION','Нажми «Старт», дождись зелёного сигнала и коснись поля как можно быстрее.']
};
const cfg=configs[mode]||configs['block-pop'];document.title=cfg[0]+" — N1kmeL's Hub";document.getElementById('title').textContent=cfg[0];document.getElementById('subtitle').textContent=cfg[1];
let score=0,best=Number(localStorage.getItem('n1kmelArcadeBest_'+mode)||0),timer=null;bestEl.textContent=best;
function points(n){score+=n;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('n1kmelArcadeBest_'+mode,String(best))}}
function btn(label,fn,primary=false){const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=label;b.onclick=fn;actions.append(b);return b}
function reset(){clearInterval(timer);score=0;scoreEl.textContent='0';actions.innerHTML='';root.innerHTML='';}
function grid(cols,rows,cls='grid'){const g=document.createElement('div');g.className=cls;g.style.gridTemplateColumns='repeat('+cols+',1fr)';g.style.gridTemplateRows='repeat('+rows+',1fr)';root.append(g);return g}
function startBlock(){
 reset();hint.textContent=cfg[1];const colors=['🟦','🟪','🟩','🟨','🟥'];let cells=Array.from({length:64},()=>Math.floor(Math.random()*5));
 const g=grid(8,8);function draw(){g.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v===-1?'':colors[v];b.classList.toggle('empty',v<0);b.onclick=()=>{if(v<0)return;const stack=[i],group=new Set([i]);while(stack.length){const p=stack.pop(),r=p>>3,c=p%8;for(const n of [r>0?p-8:-1,r<7?p+8:-1,c>0?p-1:-1,c<7?p+1:-1])if(n>=0&&!group.has(n)&&cells[n]===v){group.add(n);stack.push(n)}}}if(group.size<2){hint.textContent='Найди рядом ещё один блок такого цвета.';return}group.forEach(n=>cells[n]=-1);for(let c=0;c<8;c++){let vals=[];for(let r=7;r>=0;r--)if(cells[r*8+c]>=0)vals.push(cells[r*8+c]);for(let r=7;r>=0;r--)cells[r*8+c]=vals[7-r]??-1}points(group.size*10);hint.textContent='Комбо: '+group.size+' блоков!';draw()};g.append(b)})}
 draw();btn('Новая раскладка',startBlock);
}
function startDash(){
 reset();let lane=1,turn=0,alive=true;const g=document.createElement('div');g.className='lane-board';root.append(g);const lanes=[];for(let i=0;i<3;i++){const l=document.createElement('button');l.className='lane';l.textContent='';l.onclick=()=>{if(!alive)return;lane=i;render()};lanes.push(l);g.append(l)}
 function render(){lanes.forEach((l,i)=>{l.classList.toggle('active',i===lane);l.textContent=i===lane?'🏃':((turn%3===i)?'🚧':'·')})}
 render();btn('Старт / продолжить',()=>{if(!alive)return;turn++;const obstacle=Math.floor(Math.random()*3);if(lane===obstacle){alive=false;hint.textContent='Столкновение! Очки: '+score+'. Начни заново.';return}points(5);hint.textContent='Чисто! Выбирай следующую дорожку.';render() },true);btn('Заново',startDash);hint.textContent='Выбери дорожку, затем нажми «Старт / продолжить».';
}
function startMerge(){
 reset();let a=Array(16).fill(0);const g=grid(4,4,'grid merge-grid');function spawn(){const empty=a.map((v,i)=>v? -1:i).filter(i=>i>=0);if(empty.length)a[empty[Math.floor(Math.random()*empty.length)]]=Math.random()<.85?2:4}
 function draw(){g.innerHTML='';a.forEach(v=>{const d=document.createElement('div');d.className='merge-cell';d.dataset.v=String(v);d.textContent=v||'';g.append(d)})}
 function move(dir){const old=a.join(',');for(let line=0;line<4;line++){let ids=[];for(let k=0;k<4;k++){const r=dir==='up'?k:dir==='down'?3-k:line,c=dir==='left'?k:dir==='right'?3-k:line;ids.push(r*4+c)}let vals=ids.map(i=>a[i]).filter(Boolean);for(let j=0;j<vals.length-1;j++)if(vals[j]===vals[j+1]){vals[j]*=2;points(vals[j]*2);vals.splice(j+1,1)}while(vals.length<4)vals.push(0);ids.forEach((id,j)=>a[id]=vals[j])}if(a.join(',')!==old){spawn();draw()}}
 spawn();spawn();draw();window.onkeydown=e=>{const d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}};let sx=0,sy=0;g.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};g.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))};btn('Новая игра',startMerge);hint.textContent='Используй стрелки клавиатуры или свайп по полю.';
}
function startMemory(){
 reset();const icons=['🌙','⭐','💎','🪐','🌈','🦋','🍀','🔥'];let deck=[...icons,...icons].sort(()=>Math.random()-.5),open=[],matched=new Set(),locked=false;const g=grid(4,4);function draw(){g.innerHTML='';deck.forEach((v,i)=>{const b=document.createElement('button');b.className='memory-card'+(open.includes(i)?' open':'')+(matched.has(i)?' matched':'');b.textContent=open.includes(i)||matched.has(i)?v:'?';b.onclick=()=>{if(locked||matched.has(i)||open.includes(i))return;open.push(i);draw();if(open.length===2){locked=true;if(deck[open[0]]===deck[open[1]]){matched.add(open[0]);matched.add(open[1]);points(20);open=[];locked=false;draw();if(matched.size===16)hint.textContent='Все пары найдены! Отличная память.'}else setTimeout(()=>{open=[];locked=false;draw()},650)}};g.append(b)})}draw();btn('Перемешать',startMemory);hint.textContent='Найди 8 пар.';
}
function startReaction(){
 reset();let phase='idle',started=0,timeout=null;const pad=document.createElement('button');pad.className='reaction-pad';pad.textContent='НАЖМИ «СТАРТ»';root.append(pad);function begin(){clearTimeout(timeout);phase='wait';pad.classList.remove('go');pad.textContent='ЖДИ СИГНАЛА…';timeout=setTimeout(()=>{phase='go';started=performance.now();pad.classList.add('go');pad.textContent='ЖМИ!'},900+Math.random()*1800)}pad.onclick=()=>{if(phase==='idle'){begin();return}if(phase==='wait'){hint.textContent='Слишком рано! Попробуй ещё раз.';begin();return}if(phase==='go'){const ms=Math.round(performance.now()-started);points(Math.max(1,1000-ms));hint.textContent='Твоя реакция: '+ms+' мс. Нажми ещё раз для повтора.';phase='idle';pad.classList.remove('go');pad.textContent='ЕЩЁ РАЗ'}};btn('Старт',begin,true);hint.textContent='Тестируй реакцию без спешки.';
}
({ 'block-pop':startBlock,'sky-dash':startDash,'number-merge':startMerge,'memory-match':startMemory,'neon-reaction':startReaction }[mode]||startBlock)();
})();
</script></body></html>
